[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ttrpg-session-transcriber"
# NOTE: keep in sync with launcher/version.py (VERSION = "1.0.4").
# Single-sourcing the version (e.g. dynamic = ["version"] reading
# launcher/version.py) is a deliberate follow-up — do NOT touch or break
# launcher/version.py, which stays the runtime source of truth for now.
version = "1.0.4"
description = "ASR transcriber for tabletop RPG sessions (PySide6/QML)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dmitrii Vechkanov", email = "vechkanov90@gmail.com" }]

# Runtime minimum: only what the application imports unconditionally.
#   - PySide6: required for the QML UI (import ui).
#   - numpy:   used by the test fixtures (tests/conftest.py) and the
#              waveform/peaks tooling around core.
# The heavy ML stack (torch, faster-whisper, gigaam, sherpa-onnx) is NOT a
# dependency here — it is installed at runtime by the application itself into
# an isolated directory (see core/backend_installers.py). Do not add it.
dependencies = [
    "PySide6>=6.6,<7",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt>=4.4,<5",
    "pytest-cov",
    # The commit gate (scripts/precommit_gate.py) runs `python -m ruff` as its
    # first check, and CONTRIBUTING.md documents `ruff check .` — neither works
    # in a fresh `pip install -e .[dev]` environment unless ruff is here.
    "ruff",
    # tests/test_lint_gate.py reads .github/workflows/ci.yml as data —
    # whether the ruff gate blocks is a property of the step, not of the
    # text of the command it runs.
    "pyyaml",
    # The layer gate. Its contracts live in [tool.importlinter] below, so
    # a contributor who cannot run `lint-imports` cannot reproduce the
    # check CI fails on — the same reason ruff is on this list.
    "import-linter",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "core*",
    "domain*",
    "sources*",
    "mergers*",
    "renderers*",
    "ui*",
    "launcher*",
]
exclude = ["tests*", "scripts*"]

# QML/JS UI assets must ship inside the ui package.
[tool.setuptools.package-data]
ui = ["qml/**/*.qml", "qml/**/*.js", "qml/**/*"]

# ────────────────────────────────────────────────────────────────────
# Ruff. Until now there was no config at all, so every contributor got
# whatever defaults their installed ruff shipped — a target that moves
# with the version — while CONTRIBUTING.md claimed the settings lived
# here.
# ────────────────────────────────────────────────────────────────────
[tool.ruff]
# CONTRIBUTING.md has promised 100 for months while ruff used its
# default 88. Writing 100 down settles the contradiction in the
# document's favour, and that IS a change, not a formality: `ruff
# format` produces different output for 73 of 93 files at 100 than at
# 88 (measured). Nothing reformats on its own — no formatter runs in CI
# — but the next `ruff format .` a contributor runs will touch more
# than their own change. Landing that reflow as one reviewable commit
# is the first step of the rule-set card, deliberately not this one.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ruff's own default set, spelled out. Identical output today — 85
# findings either way, verified by running both, isolated and not — so
# no lint finding appears or disappears on landing. Widening it is a
# separate, ordered piece of work with its own card: the eight bare
# `except` clauses (BLE001) are read one by one.
select = ["E4", "E7", "E9", "F"]

# ────────────────────────────────────────────────────────────────────
# import-linter. Until this landed, ARCHITECTURE.md §3 wrote the layer
# rules as prose and said so itself: "эти правила держатся дисциплиной +
# ревью + линтером (ruff import-rules в Приоритете 3)" — wrong in both
# halves, since ruff was configured with `E4,E7,E9,F` and checked no
# import rule at all. Measured before this landed — a
# `from mergers.script_merger import ScriptMerger`
# added to `ui/models/session.py` left both blocking gates green: `ruff
# check --select F821 .` passed and the suite stayed at 952 passed. The
# full ruff set moved by exactly one finding, F401 unused-import, which
# would have vanished the moment the import was used.
#
# Two contracts, and the split is the whole point rather than tidiness.
# ────────────────────────────────────────────────────────────────────
[tool.importlinter]
root_packages = ["ui", "core", "sources", "mergers", "renderers", "domain"]

# The six folders of §3 and nothing else. `launcher/` is a second
# executable with its own spec (§4.2) and imports none of the six —
# §3 never places it in the hierarchy, so neither does this. `scripts/`
# is not even a package (no `__init__.py`) and `pyproject.toml` already
# excludes it from the distribution; `tests/` "Не меняет слои,
# добавляет инфраструктуру" and imports every
# layer plus PySide6 by design (ARCHITECTURE.md:579).

# Known limit, named rather than discovered later: a route through a
# package outside this list is invisible to both contracts. `ui`
# importing `launcher`, which imports `mergers`, is green — measured.
# `launcher` is excluded because §3 never places it in the hierarchy
# (§4.2 describes it as a second executable) and it imports none of the
# six today; putting it in would mean deciding where it sits, which §3
# does not say. Filed rather than decided here.
# So is the other limit of any static graph: `importlib.import_module`
# is not an edge grimp can see.
[[tool.importlinter.contracts]]
name = "Шесть слоёв ARCHITECTURE.md §3"
type = "layers"
layers = [
    "ui",
    "core",
    # Independent siblings, not peers that may see each other: §3
    # forbids all three pairs in both directions. `|` is what says so.
    "sources | mergers | renderers",
    "domain",
]

# This contract, not the one above, is the one the card is about.
#
# A `layers` contract forbids importing *upwards* and between
# independent siblings. Importing *downwards past a level* it allows —
# and all eight known violations are exactly that shape. Measured: with
# the layers contract alone the tree reports that contract `KEPT`, and
# the eight edges §3 writes out by hand are not reported at all.
# Entering them as `ignore_imports` there would have been configuration
# without effect — the entries do match real edges, so the run prints
# `KEPT (8 ignored imports)` and looks like debt under machine watch,
# while the contract was never going to report those edges either way.
#
# `ui` → `core` is an *adjacency* rule ("минуя core нельзя"), and that
# needs `forbidden` with `allow_indirect_imports`. Without the flag the
# same contract also reports the transitive chains §3 permits —
# `ui.cli → core → core.pipeline → domain.annotations` and 20 others
# (21 chains, measured by removing the flag).
[[tool.importlinter.contracts]]
name = "ui ходит в нижние слои только через core"
type = "forbidden"
source_modules = ["ui"]
forbidden_modules = ["sources", "mergers", "renderers", "domain"]
allow_indirect_imports = true
# The eight edges ARCHITECTURE.md §3 already lists in prose, now listed
# where a machine reads them. They are debt, not permission: the cause
# is §4.1 — the GUI does not call `core.pipeline.run`, it reproduces its
# steps and dragged the dependencies along — and the repair is planned
# separately as F-C1 (TASKS.md, задача 1.3, via a planned
# `core/merge_render.py`). Card for the reason:
# https://trello.com/c/o05Osaik
#
# What this buys today: a *ninth* edge is red immediately. That is the
# whole gate — existing debt stops being invisible, new debt stops being
# possible.
ignore_imports = [
    "ui.engines.asr_worker -> domain.annotations",
    "ui.engines.merger_worker -> domain.annotations",
    "ui.engines.merger_worker -> domain.timeline",
    "ui.engines.merger_worker -> mergers.script_merger",
    "ui.engines.merger_worker -> renderers",
    "ui.engines.merger_worker -> sources.game_log.fvtt_chat",
    "ui.engines.merger_worker -> sources.game_log.combat_dump",
    "ui.engines.pipeline_controller -> domain.annotations",
]
# This is import-linter's own default (`forbidden.py`, `EnumField(...,
# default=AlertLevel.ERROR)`), and it is written out anyway because the
# list above leans on it: once F-C1 repairs an edge, its line here
# matches nothing, and `error` turns that day into a red build naming
# the stale line — a one-word fix at the correct moment — instead of
# eight lines of decoration nobody notices. Spelled out so that a
# change of the tool's default cannot disarm that quietly; it is not a
# behaviour this adds.
unmatched_ignore_imports_alerting = "error"
