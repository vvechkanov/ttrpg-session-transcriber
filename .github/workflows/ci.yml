name: CI — pytest + build.spec

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # Manual rerun escape hatch — the synchronize trigger silently
  # dropped a push event once (see commit 07e7c34) and we had no
  # way to re-fire CI without making another commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────
  # pytest matrix — Ubuntu + Windows. Uses QT_QPA_PLATFORM=offscreen
  # so pytest-qt and the QML boot smoke run without a display server.
  # Skips tests marked `slow` / `requires_asr` — those need GPU and
  # the GigaAM / faster-whisper weights bundles, which are too heavy
  # for CI (the bootstrap installer provisions them on user machines).
  # ────────────────────────────────────────────────────────────────────
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']

    runs-on: ${{ matrix.os }}

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # numpy is imported by tests/conftest.py for its audio
          # fixtures (sine synthesis via wave + struct). The ML
          # backends (torch, faster-whisper) stay out — they are
          # provisioned by the bootstrap launcher at runtime, not
          # needed for the test suite.
          # PyYAML is for tests/test_lint_gate.py, which reads this
          # workflow as data: checking that the ruff gate blocks needs
          # the step's `continue-on-error`, not just its text.
          pip install PySide6 pytest pytest-qt pytest-cov numpy pyyaml

      # Linux-only: libEGL / xkbcommon are needed by Qt's offscreen
      # platform plugin even though we don't show a window. Without
      # them import of PySide6.QtQuickControls2 segfaults. ffmpeg is
      # pulled in for tests/test_core_peaks.py which synthesises a
      # sine-wave FLAC via ``ffmpeg -f lavfi -i sine=…`` — the
      # bundled tools/ffmpeg/ isn't checked in (.gitignore).
      - name: Install Qt offscreen + ffmpeg deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libfontconfig1 \
            libdbus-1-3 \
            ffmpeg

      # Windows: runners already ship ffmpeg.exe on PATH via chocolatey's
      # pre-installed tooling; test_core_peaks.py resolves it through
      # shutil.which. Verify here so a future runner-image change
      # surfaces as a skip rather than a silent pass.
      - name: Verify ffmpeg on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version | Select-Object -First 1

      - name: Run pytest
        shell: bash
        run: |
          pytest tests -m "not slow and not requires_asr" -v

  # ────────────────────────────────────────────────────────────────────
  # Ruff gate. docs/process.md §7.1 has listed `ruff check --select F821`
  # as a blocking check for months while ruff ran nowhere in CI — the
  # only mention of it under .github/ was an unchecked box in the PR
  # template, which is an honour system rather than a gate. The rule
  # this runs is already green on master, so the job blocks nothing
  # retroactively; widening the set is a separate, ordered piece of work.
  #
  # F821 earns its place on evidence: a fallback path called a `logger`
  # the module never imported, the NameError was swallowed by a broad
  # except, and merged.txt silently did not get written — a lost
  # transcript from a linting error ruff finds in half a second.
  # ────────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          # Pinned, and the pin is the point: this is the only blocking
          # step here, and `--select F821` names a rule, not the code
          # that implements it. An unpinned linter turns every PR red the
          # day detection changes, on a tree nobody touched. Raising the
          # pin is then a visible commit rather than a surprise.
          pip install "ruff==0.15.8"

      - name: Ruff gate — undefined names
        run: ruff check --select F821 .

      # Not a gate: the wider set still has findings, and turning it
      # blocking here would forbid every commit until they are fixed.
      # `--exit-zero` rather than `continue-on-error`, so the step is
      # honestly green instead of a red cross inside a passing job — the
      # latter is what `gh run view --log-failed` reports as a failure.
      # The count goes to the job summary so it is visible without
      # opening the log.
      # `always()` because a step has an implicit `success()` otherwise, and
      # the run where the gate went red is exactly the run where you want the
      # rest of the picture. Without it the report is missing precisely when
      # it is useful.
      - name: Ruff, full configured set (report only)
        if: always()
        run: |
          {
            echo '### Ruff — full configured set (not blocking)'
            echo '```'
            ruff check . --exit-zero --statistics
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────────
  # Layer gate. Until this job existed, ARCHITECTURE.md §3 wrote the
  # dependency rules and then admitted they were held by "дисциплиной +
  # ревью + линтером", while the linter it meant checked no import rule
  # at all; §7.1 of docs/process.md listed import-linter as work ahead.
  # Measured before
  # this job existed: a `from mergers.script_merger import ScriptMerger`
  # added to ui/models/session.py left both blocking gates green — ruff
  # F821 passed, 952 tests passed. Nothing in the repository could see
  # it.
  #
  # Its own job rather than a step inside `lint`, for the same reason
  # `spec-lint` is one: a red layer contract and a red F821 are
  # different failures, and a job apiece says which without opening a
  # log. It is also the one gate that reads two lazy imports greps
  # cannot reach — `merger_worker` pulls `sources.game_log` from inside
  # two methods.
  # ────────────────────────────────────────────────────────────────────
  layers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install import-linter
        run: |
          python -m pip install --upgrade pip
          # Pinned for the reason the ruff pin above spells out, with one
          # more on top: the contracts lean on a *behaviour* of the tool.
          # `allow_indirect_imports` is what makes the adjacency rule
          # checkable at all, and the eight exceptions stay honest only
          # while an entry matching nothing is an error — which is the
          # tool's default today, and therefore something a minor
          # release could change on a diff nobody wrote.
          pip install "import-linter==2.15"

      # No `pip install -e .` and no PySide6: grimp builds the graph by
      # reading source, not by importing it, so the gate needs neither
      # the dependencies nor a display. That is what keeps this job at a
      # few seconds.
      - name: Layer contracts — ARCHITECTURE.md §3
        run: lint-imports

  # ────────────────────────────────────────────────────────────────────
  # Static build.spec check — parse-only, no PyInstaller run. The real
  # build happens in release.yml on tag push. This catches spec drifts
  # early (e.g. typoed hiddenimports).
  # ────────────────────────────────────────────────────────────────────
  spec-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          # conftest.py pulls in numpy for the audio fixtures even
          # when we only run test_build_spec.py — same dep list as
          # the full pytest job, minus PySide6.
          pip install pytest numpy

      - name: Run build.spec invariants
        # --noconftest skips the project-wide conftest (numpy fixtures
        # etc.) since test_build_spec.py only parses the .spec file;
        # keeps spec-lint a lean 7-second check.
        run: pytest tests/test_build_spec.py -v --noconftest
